name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-homeassistant-custom-component aiohttp flake8 black
      
      - name: Run lint
        run: |
          black --check custom_components/
          flake8 custom_components/
      
      - name: Run tests
        run: |
          pytest tests/ -v --cov=custom_components.orei_bk808
