# LOVELACE DASHBOARD TEMPLATE
# Import via: Settings → Dashboards → + Add Dashboard → Import from File
#
# This integration uses `has_entity_name = True`, so every entity ID is
# the simple, global name set by the integration:
#
#   switch.matrix_power
#   sensor.power / sensor.firmware / sensor.output_<N>_routed_input
#   media_player.input_<N>       (the SOURCE device on input N: transport/volume/power)
#   media_player.output_<N>      (the SINK on output N: select_source=routing + CEC)
#   select.output_<N>_route      (dedicated routing select)
#   select.output_<N>_remote     (ROUTING + MUTE + CEC for that output)
#   select.input_<N>_remote      (CEC actions for that input)
#   switch.output_<N>_mute
#   button.input_<N>_<command>   (still present, optional granular control)
#   button.output_<N>_<command>
#
# Entity IDs are case-insensitive and use underscores (HA slugifies).
# If you've added naming overrides or HA shows slightly different IDs,
# adjust the strings below.

title: "Orei BK808 Master Control"
icon: mdi:matrix
path: orei-control
panel: true

cards:
  - type: vertical-stack
    cards:
      # -------------------------------------------------- row 1: power + status
      - type: horizontal
        cards:
          - type: button
            entity: switch.matrix_power
            name: Matrix Power
            icon: mdi:power
            show_state: true
            style:
              color: brand
            tap_action:
              action: toggle
          - type: entity
            entity: sensor.power
            name: Power
            icon: mdi:power
          - type: entity
            entity: sensor.firmware
            name: Firmware
            icon: mdi:tag-multiple

      # -------------------------------------------------- row 2: routing matrix
      - type: heading
        heading: "Routing"
        icon: mdi:input-hdmi

      - type: grid
        columns: 4
        square: false
        cards:
          - type: selector
            entity: select.output_1_route
            name: Output 1
          - type: selector
            entity: select.output_2_route
            name: Output 2
          - type: selector
            entity: select.output_3_route
            name: Output 3
          - type: selector
            entity: select.output_4_route
            name: Output 4
          - type: selector
            entity: select.output_5_route
            name: Output 5
          - type: selector
            entity: select.output_6_route
            name: Output 6
          - type: selector
            entity: select.output_7_route
            name: Output 7
          - type: selector
            entity: select.output_8_route
            name: Output 8

      # -------------------------------------------------- row 2b: native media players
      # One real HA media player per port. Output players include
      # "Input source" = the routing switcher. Use these as the primary UI.
      - type: heading
        heading: "Media Players"
        icon: mdi:play-circle

      - type: grid
        columns: 2
        square: false
        cards:
          - type: media-control
            entity: media_player.output_1
          - type: media-control
            entity: media_player.output_2
          - type: media-control
            entity: media_player.output_3
          - type: media-control
            entity: media_player.output_4
          - type: media-control
            entity: media_player.output_5
          - type: media-control
            entity: media_player.output_6
          - type: media-control
            entity: media_player.output_7
          - type: media-control
            entity: media_player.output_8

      - type: heading
        heading: "Sources (inputs)"
        icon: mdi:input

      - type: grid
        columns: 2
        square: false
        cards:
          - type: media-control
            entity: media_player.input_1
          - type: media-control
            entity: media_player.input_2
          - type: media-control
            entity: media_player.input_3
          - type: media-control
            entity: media_player.input_4
          - type: media-control
            entity: media_player.input_5
          - type: media-control
            entity: media_player.input_6
          - type: media-control
            entity: media_player.input_7
          - type: media-control
            entity: media_player.input_8

      # -------------------------------------------------- row 3: all-in-one remotes
      - type: heading
        heading: "Remotes (quick selects)"
        icon: mdi:remote

      - type: grid
        columns: 4
        square: false
        cards:
          - type: selector
            entity: select.input_1_remote
            name: Input 1 Remote
          - type: selector
            entity: select.input_2_remote
            name: Input 2 Remote
          - type: selector
            entity: select.input_3_remote
            name: Input 3 Remote
          - type: selector
            entity: select.input_4_remote
            name: Input 4 Remote
          - type: selector
            entity: select.input_5_remote
            name: Input 5 Remote
          - type: selector
            entity: select.input_6_remote
            name: Input 6 Remote
          - type: selector
            entity: select.input_7_remote
            name: Input 7 Remote
          - type: selector
            entity: select.input_8_remote
            name: Input 8 Remote

      - type: grid
        columns: 4
        square: false
        cards:
          - type: selector
            entity: select.output_1_remote
            name: Output 1 Remote
          - type: selector
            entity: select.output_2_remote
            name: Output 2 Remote
          - type: selector
            entity: select.output_3_remote
            name: Output 3 Remote
          - type: selector
            entity: select.output_4_remote
            name: Output 4 Remote
          - type: selector
            entity: select.output_5_remote
            name: Output 5 Remote
          - type: selector
            entity: select.output_6_remote
            name: Output 6 Remote
          - type: selector
            entity: select.output_7_remote
            name: Output 7 Remote
          - type: selector
            entity: select.output_8_remote
            name: Output 8 Remote

      # -------------------------------------------------- row 4: per-output state
      - type: heading
        heading: "Outputs"
        icon: mdi:television

      - type: grid
        columns: 4
        square: false
        cards:
          - type: entities
            title: Output 1
            entities:
              - entity: sensor.output_1_routed_input
              - entity: switch.output_1_mute
          - type: entities
            title: Output 2
            entities:
              - entity: sensor.output_2_routed_input
              - entity: switch.output_2_mute
          - type: entities
            title: Output 3
            entities:
              - entity: sensor.output_3_routed_input
              - entity: switch.output_3_mute
          - type: entities
            title: Output 4
            entities:
              - entity: sensor.output_4_routed_input
              - entity: switch.output_4_mute
          - type: entities
            title: Output 5
            entities:
              - entity: sensor.output_5_routed_input
              - entity: switch.output_5_mute
          - type: entities
            title: Output 6
            entities:
              - entity: sensor.output_6_routed_input
              - entity: switch.output_6_mute
          - type: entities
            title: Output 7
            entities:
              - entity: sensor.output_7_routed_input
              - entity: switch.output_7_mute
          - type: entities
            title: Output 8
            entities:
              - entity: sensor.output_8_routed_input
              - entity: switch.output_8_mute

      # -------------------------------------------------- row 4: CEC — Input 1
      - type: heading
        heading: "CEC — Input 1"
        icon: mdi:remote

      - type: grid
        columns: 6
        square: false
        cards:
          - type: button
            entity: button.input_1_play
            name: Play
            icon: mdi:play
            style: {color: brand}
          - type: button
            entity: button.input_1_pause
            name: Pause
            icon: mdi:pause
          - type: button
            entity: button.input_1_stop
            name: Stop
            icon: mdi:stop
          - type: button
            entity: button.input_1_next_track
            name: Next
            icon: mdi:skip-next
          - type: button
            entity: button.input_1_prev_track
            name: Prev
            icon: mdi:skip-previous
          - type: button
            entity: button.input_1_fast_forward
            name: FF
            icon: mdi:fast-forward
          - type: button
            entity: button.input_1_rewind
            name: RW
            icon: mdi:rewind
          - type: button
            entity: button.input_1_enter
            name: Enter
            icon: mdi:check
          - type: button
            entity: button.input_1_menu
            name: Menu
            icon: mdi:menu
          - type: button
            entity: button.input_1_loop
            name: Loop
            icon: mdi:loop
          - type: button
            entity: button.input_1_up
            name: Up
            icon: mdi:arrow-up
          - type: button
            entity: button.input_1_down
            name: Down
            icon: mdi:arrow-down
          - type: button
            entity: button.input_1_left
            name: Left
            icon: mdi:arrow-left
          - type: button
            entity: button.input_1_right
            name: Right
            icon: mdi:arrow-right
          - type: button
            entity: button.input_1_power_on
            name: Power On
            icon: mdi:power-cycle
          - type: button
            entity: button.input_1_power_off
            name: Power Off
            icon: mdi:power-off
          - type: button
            entity: button.input_1_mute
            name: Mute
            icon: mdi:speaker-off
            style: {color: error}
          - type: button
            entity: button.input_1_volume_up
            name: Vol +
            icon: mdi:volume-plus
          - type: button
            entity: button.input_1_volume_down
            name: Vol −
            icon: mdi:volume-minus

      # -------------------------------------------------- row 5: CEC — Output 1 (AVR)
      - type: heading
        heading: "CEC — Output 1 (AVR)"
        icon: mdi:remote

      - type: grid
        columns: 7
        square: false
        cards:
          - type: button
            entity: button.output_1_power_on
            name: Power On
            icon: mdi:power-cycle
          - type: button
            entity: button.output_1_power_off
            name: Power Off
            icon: mdi:power-off
          - type: button
            entity: button.output_1_mute
            name: Mute
            icon: mdi:speaker-off
            style: {color: error}
          - type: button
            entity: button.output_1_volume_up
            name: Vol +
            icon: mdi:volume-plus
          - type: button
            entity: button.output_1_volume_down
            name: Vol −
            icon: mdi:volume-minus
          - type: button
            entity: button.output_1_enter
            name: Enter
            icon: mdi:check
          - type: button
            entity: button.output_1_play
            name: Play
            icon: mdi:play
          - type: button
            entity: button.output_1_prev_track
            name: Prev
            icon: mdi:skip-previous
          - type: button
            entity: button.output_1_next_track
            name: Next
            icon: mdi:skip-next
          - type: button
            entity: button.output_1_left
            name: Left
            icon: mdi:arrow-left
          - type: button
            entity: button.output_1_right
            name: Right
            icon: mdi:arrow-right
          - type: button
            entity: button.output_1_down
            name: Down
            icon: mdi:arrow-down
          - type: button
            entity: button.output_1_menu
            name: Menu
            icon: mdi:menu
          - type: button
            entity: button.output_1_loop
            name: Loop
            icon: mdi:loop
